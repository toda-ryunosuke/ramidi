name: Release Executables

on:
  push:
    tags:
      - 'v*'  # v1.0.0 などのタグがpushされたら自動実行

jobs:
  release:
    name: Build & Upload Release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Releaseを作成・編集する権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # 1. GradleプラグインでネイティブコンパイルとZIPパッケージングを自動実行
      - name: Build and Package
        run: ./gradlew nativeCompile distZip

      # 2. 生成されたZIP(ramidi-x.x.x.zip等)をOS入りの名前にリネーム（上書き防止）
      - name: Rename Zip
        shell: bash
        run: mv build/distributions/*.zip ramidi-${{ matrix.os }}.zip

      # 3. Releases ページへ自動アップロード
      - name: Upload to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ramidi-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}